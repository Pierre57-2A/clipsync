<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0e17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ClipSync">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>ClipSync</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="env-pill" id="envBtn" aria-label="Changer d'environnement">
        <img class="logo-img" src="/logo.png" alt="" width="24" height="24">
        <span class="env-name" id="envName">ClipSync</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Réglages">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <div class="status">
      <span class="dot off" id="dot"></span>
      <span id="statusText">…</span>
      <span class="spacer"></span>
      <span id="statusSub"></span>
    </div>

    <div class="actions">
      <button class="primary" id="send">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>
        </svg>
        <span>Envoyer le presse-papiers</span>
      </button>
      <button class="secondary" id="sendFiles" aria-label="Envoyer des fichiers">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 9l5-5 5 5"/><path d="M12 4v12"/>
        </svg>
        <span>Fichier</span>
      </button>
      <input type="file" id="fileInput" multiple hidden>
    </div>

    <div id="progress" hidden>
      <div id="progressLabel"></div>
      <div class="bar"><div id="progressBar"></div></div>
    </div>

    <section class="block">
      <div class="tabs" role="tablist">
        <button class="tab is-on" data-tab="all" role="tab">Tout</button>
        <button class="tab" data-tab="fav" role="tab">Favoris</button>
        <span class="spacer"></span>
        <button class="icon-btn small" id="searchBtn" aria-label="Rechercher">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        </button>
      </div>
      <input id="histSearch" class="search" type="search" inputmode="search" placeholder="Rechercher…" autocapitalize="off" autocorrect="off" spellcheck="false" hidden>
      <div id="list"></div>
    </section>
  </main>

  <!-- Réglages ------------------------------------------------------------ -->
  <dialog id="settings" class="sheet">
    <header class="sheet-head">
      <h3>Réglages</h3>
      <button class="icon-btn small" id="cfgClose" aria-label="Fermer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>

    <section class="sheet-sec">
      <h4>Cet environnement</h4>
      <label for="cfgEnvName">Nom</label>
      <input id="cfgEnvName" placeholder="Perso" autocapitalize="words">
      <label for="cfgPhrase">Phrase de couplage <span class="lbl-note">— la même partout</span></label>
      <input id="cfgPhrase" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ta phrase secrète">
      <label for="cfgName">Nom de cet appareil</label>
      <input id="cfgName" placeholder="iPhone">
    </section>

    <section class="sheet-sec">
      <h4>Appareils</h4>
      <div id="cfgDevices"></div>
      <button class="link" id="cfgUnhide" hidden></button>
    </section>

    <section class="sheet-sec">
      <h4>Environnements</h4>
      <div id="cfgEnvs"></div>
      <button class="link" id="cfgAddEnv">+ Nouvel environnement</button>
    </section>

    <section class="sheet-sec">
      <h4>Historique</h4>
      <p class="note" id="cfgStorage">Purge automatique après 23 h 59. Les favoris restent (50 max).</p>
      <button class="link danger" id="cfgClear">Vider l'historique (garde les favoris)</button>
    </section>

    <div class="sheet-actions">
      <button class="save" id="cfgSave">Enregistrer</button>
    </div>
  </dialog>

  <!-- Sélecteur d'environnement ------------------------------------------- -->
  <dialog id="envPicker">
    <h3>Environnement</h3>
    <div id="envList"></div>
    <button class="link" id="envAdd">+ Nouvel environnement</button>
    <div class="dialog-actions">
      <button class="cancel" id="envCancel">Fermer</button>
    </div>
  </dialog>

  <!-- Création d'un environnement ----------------------------------------- -->
  <dialog id="envEdit">
    <h3>Nouvel environnement</h3>
    <label for="newEnvName">Nom</label>
    <input id="newEnvName" placeholder="Boulot" autocapitalize="words">
    <label for="newEnvPhrase">Phrase de couplage</label>
    <input id="newEnvPhrase" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="la même sur les autres appareils">
    <div class="dialog-actions">
      <button class="cancel" id="newEnvCancel">Annuler</button>
      <button class="save" id="newEnvSave">Créer</button>
    </div>
  </dialog>

  <!-- Choix de la cible d'un envoi ---------------------------------------- -->
  <dialog id="targetPicker">
    <h3 id="targetTitle">Envoyer à</h3>
    <div id="targetList"></div>
    <div class="dialog-actions">
      <button class="cancel" id="targetCancel">Annuler</button>
    </div>
  </dialog>

  <!-- Confirmation --------------------------------------------------------- -->
  <dialog id="confirm">
    <h3 id="confirmTitle">Confirmer</h3>
    <p class="note" id="confirmBody"></p>
    <div class="dialog-actions">
      <button class="cancel" id="confirmNo">Annuler</button>
      <button class="save danger-btn" id="confirmYes">Supprimer</button>
    </div>
  </dialog>

  <div id="toast"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
