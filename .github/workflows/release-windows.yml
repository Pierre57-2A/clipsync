name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publier l'executable autonome
        working-directory: windows/ClipSync
        run: >
          dotnet publish -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o ../../publish/autonome

      - name: Publier l'executable leger
        working-directory: windows/ClipSync
        run: >
          dotnet publish -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o ../../publish/leger

      - name: Nommer les deux binaires
        run: |
          Copy-Item publish/leger/ClipSync.exe ClipSync.exe
          Copy-Item publish/autonome/ClipSync.exe ClipSync-autonome.exe
          Get-ChildItem ClipSync*.exe | ForEach-Object { "{0,-24} {1,8:N1} Mo" -f $_.Name, ($_.Length / 1MB) }

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClipSync.exe
            ClipSync-autonome.exe
          generate_release_notes: true
          body: |
            ## Lequel télécharger

            **`ClipSync.exe`** — environ 0,5 Mo. C'est celui-ci qu'il vous faut.
            Il demande le [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0/runtime),
            que Windows propose d'installer au premier lancement s'il manque.

            **`ClipSync-autonome.exe`** — environ 68 Mo. Aucun prérequis, tout est
            embarqué. À prendre si vous ne pouvez pas installer le runtime, ou pour
            une machine hors ligne.
