name: clipsync

services:
  # Serveur relais (présence + relais presse-papiers + images temporaires).
  # Exposé uniquement en local (127.0.0.1) : c'est Nginx qui termine le TLS
  # et proxifie WSS/HTTPS vers ce port. Choisis un port hôte libre si besoin.
  relay:
    build: ./server
    restart: unless-stopped
    # Le VPS heberge la boutique L'Atelier CBD sur le meme noyau. Sans plafond,
    # une fuite memoire ici consomme les 11,7 Go de la machine et emporte la
    # prod avec elle. Mesure du 02/08/2026 : 87 Mo. 512 Mo est un fusible, pas
    # une allocation : il ne borne que ce qu'une fuite peut emporter.
    mem_limit: 512m
    environment:
      NODE_ENV: production
      PORT: 8787
    ports:
      - "127.0.0.1:${CLIP_PORT:-8787}:8787"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
